# Prueba y despliega.
#
# En cada push a `main`: se levanta la suite entera contra MariaDB y, SOLO si
# pasa, se entra por SSH al servidor y se ejecuta `desplegar.sh`.
#
# Esa puerta es el motivo de que este archivo exista. Un `git pull` automático
# sin pruebas publica el error en internet treinta segundos después de haberlo
# escrito; con la puerta, la suite que ya existe se convierte en el guardián del
# despliegue.
#
# Mientras no existan los secretos de Hostinger, el trabajo de despliegue se
# salta solo y la ejecución queda en verde: las pruebas siguen sirviendo.
#
# Secretos que hay que crear en GitHub (Settings -> Secrets and variables ->
# Actions):
#
#   HOSTINGER_HOST       dominio o IP del servidor
#   HOSTINGER_PUERTO     puerto SSH (en Hostinger no es el 22)
#   HOSTINGER_USUARIO    usuario SSH
#   HOSTINGER_CLAVE_SSH  clave PRIVADA completa, con sus lineas BEGIN y END
#   HOSTINGER_RUTA       ruta al proyecto en el servidor
#
name: Probar y desplegar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  pruebas:
    name: Pruebas
    # Version FIJA y no `ubuntu-latest`, a proposito. GitHub pasa esa etiqueta a
    # Ubuntu 26.04 poco a poco entre el 19/10 y el 19/11/2026, o sea que un push
    # cualquiera caeria en una maquina u otra al azar. Y este trabajo es la
    # puerta del despliegue: si la imagen nueva rompe `setup-php` (en sep/2026
    # tenia incidencias abiertas con 26.04) o el servicio de MariaDB, lo que se
    # para es publicar, el dia que menos convenga. Subir de version se hace
    # aposta, cambiando esta linea en una rama y mirando el CI, no por sorpresa.
    runs-on: ubuntu-24.04

    # Las pruebas corren contra MariaDB y no contra SQLite, y no es preferencia:
    # comprueban garantias del motor —columnas generadas con indice unico,
    # triggers con SIGNAL, SELECT ... FOR UPDATE— que SQLite no tiene.
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: raiz
          MARIADB_DATABASE: test_matriculas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -praiz"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v7

      - name: Preparar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, exif, pdo_mysql, mbstring, intl, zip
          coverage: none

      - name: Cachear las dependencias
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      # Los datos de conexion se escriben en el .env y no como variables de
      # entorno: phpunit.xml ya define DB_CONNECTION y DB_DATABASE, y mezclar
      # las dos fuentes hace que cual gana dependa de detalles de PHPUnit.
      - name: Apuntar a la MariaDB del contenedor
        run: |
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/'   .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/'        .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=raiz/' .env
          # La base del contenedor se llama como la de las pruebas. No afecta a
          # `php artisan test` --phpunit.xml define DB_DATABASE y gana--, pero
          # los guiones de database/ solo leen el .env, y sin esto apuntarian a
          # `matriculas`, que en el contenedor no existe.
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=test_matriculas/' .env

      - name: Pruebas
        run: php artisan test

      # DESPUES de las pruebas, y no antes, a proposito. Pint es barato y lo
      # normal seria ponerlo primero para fallar rapido; pero si falla primero,
      # las pruebas no llegan a correr y el viaje se hace dos veces: arreglas un
      # espacio, empujas, y solo entonces descubres que ademas algo esta roto.
      # Lo que importa mas se comprueba antes.
      #
      # Es una PUERTA y no un aviso: si esto no bloquea, el formato vuelve a
      # ensuciarse solo. Ya paso una vez y costo un commit de 69 archivos, con
      # el ruido de formato mezclado en el diff de lo que de verdad cambiaba.
      # Cuando se ponga en rojo, se arregla con `./vendor/bin/pint` y a seguir.
      - name: Formato (Pint)
        run: ./vendor/bin/pint --test

      # Analisis estatico. Va DESPUES de Pint por lo mismo que Pint va despues
      # de las pruebas: lo que mas importa se comprueba antes, para no hacer el
      # viaje dos veces.
      #
      # `--memory-limit` no es opcional: con el limite por defecto de 128M el
      # proceso se queda sin memoria a media pasada, informa «3 errores» que son
      # los del propio crash, y avisa de que el resultado esta INCOMPLETO. Sale
      # con codigo 1, asi que la puerta no se abre en falso, pero el mensaje
      # despista a quien lo lea con prisa.
      #
      # Hay una linea base con la deuda que ya existia (phpstan-baseline.neon).
      # Esto NO comprueba que el proyecto este limpio: comprueba que no se
      # ensucie mas.
      - name: Analisis estatico (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Las garantias que NO son de PHP: columnas generadas con indice unico,
      # triggers que lanzan SIGNAL, CHECK de estado y de ranura, y los
      # RESTRICT/CASCADE elegidos uno a uno. Las pruebas usan el esquema pero no
      # comprueban que siga prometiendo lo que promete; esto si.
      #
      # Existe este paso porque el guion estuvo ROTO EN SILENCIO cuatro dias
      # (N-02 del informe): la migracion que convirtio `grupos.horario` en filas
      # de `sesiones_grupo` lo dejo insertando en una columna que ya no existia,
      # y dos comprobaciones fallaban con un error de columna en vez de
      # comprobar nada. Nadie se entero porque nada automatizado lo corria. Es
      # decir: el guion que avisa cuando el esquema deja de cumplir lo que
      # promete era, el mismo, lo que nadie estaba mirando.
      #
      # VACIA la base antes de empezar, y por eso va al final: lo que corre
      # despues no puede contar con que haya datos. Las dos barreras del guion
      # se cumplen aqui sin debilitarlas --`.env.example` ya trae APP_ENV=local
      # y la bandera va explicita--, asi que esto NO abre la puerta que se
      # cerro en N-01: en un servidor seguiria negandose.
      - name: Garantias del esquema
        run: php database/verificacion_esquema.php --borrar-datos

  desplegar:
    name: Desplegar
    needs: pruebas
    # Fija por lo mismo que la de las pruebas.
    runs-on: ubuntu-24.04
    # Una rama de trabajo se prueba, pero no se publica.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      # El contexto `secrets` no se puede consultar en el `if` de un trabajo,
      # asi que la comprobacion se hace aqui: sin servidor configurado, el
      # despliegue se salta y la ejecucion queda en verde.
      - name: Comprobar si hay servidor configurado
        id: config
        run: |
          if [ -z "${{ secrets.HOSTINGER_HOST }}" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "Sin secretos de Hostinger todavia: no hay donde desplegar."
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar por SSH
        if: steps.config.outputs.hay == 'si'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PUERTO }}
          username: ${{ secrets.HOSTINGER_USUARIO }}
          key: ${{ secrets.HOSTINGER_CLAVE_SSH }}
          command_timeout: 15m
          script: |
            cd ${{ secrets.HOSTINGER_RUTA }}
            chmod +x desplegar.sh respaldar.sh
            ./desplegar.sh
